version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    # Dependabot writes its own commit messages, so the Conventional Commits
    # form only holds for them if it is configured here. `include: scope` is
    # what appends the `(deps)`, giving `ci(deps): bump ...`.
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
